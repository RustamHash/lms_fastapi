name: Deploy LMS

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy LMS (Docker)
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy to deployment directory
        run: |
          set -e
          DEPLOY_DIR="/data/projects/lms_fastapi"
          echo "Создание директории для деплоя..."
          sudo mkdir -p "$DEPLOY_DIR" || true
          sudo chown "$USER:$USER" "$DEPLOY_DIR" || true
          echo "Копирование файлов..."
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.venv' \
            --exclude='.env' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='data' \
            --exclude='logs' \
            --exclude='letsencrypt' \
            "${{ github.workspace }}/" "$DEPLOY_DIR/"
          echo "Проверка содержимого..."
          ls -la "$DEPLOY_DIR"

      - name: Build frontend
        working-directory: /data/projects/lms_fastapi/frontend
        run: |
          set -e
          if [ ! -d node_modules ]; then
            npm install
          fi
          npm run build

      - name: Deploy with Docker Compose
        working-directory: /data/projects/lms_fastapi
        run: |
          set -e
          echo "Сборка образов..."
          docker compose build

          echo "Postgres + Redis..."
          docker compose up -d postgres redis

          echo "Ждём Postgres..."
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' lms_postgres 2>/dev/null || echo "missing")
            if [ "$status" = "healthy" ]; then
              break
            fi
            sleep 2
          done
          status=$(docker inspect --format='{{.State.Health.Status}}' lms_postgres 2>/dev/null || echo "missing")
          if [ "$status" != "healthy" ]; then
            echo "❌ Postgres не healthy (статус: $status)"
            docker compose logs postgres --tail=50 || true
            exit 1
          fi

          echo "Миграции..."
          docker compose run --rm --no-deps fastapi alembic upgrade head

          echo "Bootstrap пользователей (admin + system_bot)..."
          docker compose run --rm --no-deps fastapi python scripts/bootstrap_users.py

          echo "Запуск остальных сервисов..."
          docker compose up -d

          echo "Проверка контейнеров..."
          docker compose ps
          for container in lms_postgres lms_redis lms_fastapi lms_celery_worker lms_flower; do
            status=$(docker inspect --format='{{.State.Status}}' $container 2>/dev/null || echo "not_found")
            if [ "$status" != "running" ]; then
              echo "❌ Контейнер $container не запущен (статус: $status)"
              docker compose logs $container --tail=50 || true
              exit 1
            fi
            echo "✅ $container: running"
          done

      - name: Health check
        working-directory: /data/projects/lms_fastapi
        run: |
          set -e
          echo "Проверка API /health..."
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8003/health)
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "❌ API health failed"
            docker compose logs fastapi --tail=50 || true
            exit 1
          fi
          echo "Проверка Flower..."
          curl -s -o /dev/null -w "HTTP %{http_code}\n" http://localhost:5555 || true
