name: Deploy LMS

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy LMS (Docker)
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy to deployment directory
        run: |
          set -e
          DEPLOY_DIR="/data/projects/lms_fastapi"
          echo "Создание директории для деплоя..."
          sudo mkdir -p "$DEPLOY_DIR" || true
          sudo chown -R "$USER:$USER" "$DEPLOY_DIR" || true
          echo "Копирование файлов..."
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.venv' \
            --exclude='.env' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='data' \
            --exclude='logs' \
            --exclude='letsencrypt' \
            "${{ github.workspace }}/" "$DEPLOY_DIR/"
          echo "Проверка содержимого..."
          ls -la "$DEPLOY_DIR"

      - name: Build frontend
        working-directory: /data/projects/lms_fastapi/frontend
        run: |
          set -e
          if [ ! -d node_modules ]; then
            npm install
          fi
          npm run build

      - name: Deploy with Docker Compose
        working-directory: /data/projects/lms_fastapi
        run: |
          set -e
          echo "Запуск Docker Compose..."
          docker compose up -d --build
          
          echo "Ожидание готовности..."
          sleep 10
          
          echo "Проверка контейнеров..."
          docker compose ps
          
          echo "Проверка статусов..."
          for container in lms_postgres lms_redis lms_fastapi lms_celery_worker lms_flower; do
            status=$(docker inspect --format='{{.State.Status}}' $container 2>/dev/null || echo "not_found")
            if [ "$status" != "running" ]; then
              echo "❌ Контейнер $container не запущен (статус: $status)"
              docker compose logs $container --tail=50 || true
              exit 1
            fi
            echo "✅ $container: running"
          done

      - name: Health check
        run: |
          set -e
          echo "Проверка API..."
          curl -s -o /dev/null -w "HTTP %{http_code}\n" http://localhost:8002/docs || true
          echo "Проверка Flower..."
          curl -s -o /dev/null -w "HTTP %{http_code}\n" http://localhost:5555 || true
